replicaCount: 1

# No published GHCR image — build locally.
image:
  repository: eudi-srv-statuslist
  tag: "v0.9.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 5000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  pathType: Prefix
  hosts: []
  tls: []

# nginx sidecar: Access-Control-Allow-Origin for browser wallets (NodePort / Ingress).
cors:
  enabled: false
  allowOrigin: "*"
  allowMethods: "GET, POST, PUT, DELETE, OPTIONS"
  allowHeaders: "*"
  image: "nginx:1.27-alpine"

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  backupSize: 1Gi

publicURL: "http://localhost:30822/"

apiKey: "dev-eudi-statuslist-api-key"

signing:
  generate: true
  existingSecret: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi
