apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eudi-statuslist
  labels:
    app.kubernetes.io/name: eudi-statuslist
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eudi-statuslist
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eudi-statuslist
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.cors.enabled }}
        checksum/cors-proxy: {{ include (print $.Template.BasePath "/cors-proxy-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.signing.generate (not .Values.signing.existingSecret) }}
      initContainers:
        - name: generate-signing-material
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -e
              apk add --no-cache openssl >/dev/null
              mkdir -p /certs
              if [ ! -f /certs/key.pem ] || [ ! -f /certs/cert.der ]; then
                openssl ecparam -name prime256v1 -genkey -noout -out /certs/key.pem
                openssl req -new -x509 -key /certs/key.pem -out /certs/cert.crt \
                  -days 3650 -subj "/CN=eudi-statuslist-dev"
                openssl x509 -outform der -in /certs/cert.crt -out /certs/cert.der
              fi
          volumeMounts:
            - name: certs
              mountPath: /certs
      {{- end }}
      containers:
        {{- if .Values.cors.enabled }}
        - name: cors-proxy
          image: {{ .Values.cors.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: cors-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
        - name: eudi-statuslist
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            {{- if .Values.cors.enabled }}
            - name: backend
              containerPort: 5001
              protocol: TCP
            {{- else }}
            - name: http
              containerPort: {{ .Values.service.port | default 5000 }}
              protocol: TCP
            {{- end }}
          env:
            {{- if .Values.cors.enabled }}
            - name: FLASK_RUN_PORT
              value: "5001"
            {{- end }}
            - name: API_key
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-statuslist
                  key: API_key
          volumeMounts:
            - name: config
              mountPath: /status-list/app/config_service.py
              subPath: config_service.py
              readOnly: true
            - name: certs
              mountPath: /status-list/certs
              readOnly: true
            - name: data
              mountPath: /var/opt/status_lists
            - name: backup
              mountPath: /var/opt/status_list_backup
          readinessProbe:
            tcpSocket:
              port: {{ if .Values.cors.enabled }}backend{{ else }}http{{ end }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ if .Values.cors.enabled }}backend{{ else }}http{{ end }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-eudi-statuslist-config
        {{- if .Values.cors.enabled }}
        - name: cors-nginx
          configMap:
            name: {{ .Release.Name }}-eudi-statuslist-cors
        {{- end }}
        - name: certs
          {{- if .Values.signing.existingSecret }}
          secret:
            secretName: {{ .Values.signing.existingSecret }}
          {{- else if .Values.signing.generate }}
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-eudi-statuslist-certs
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- else }}
          secret:
            secretName: {{ .Release.Name }}-eudi-statuslist-signing
          {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-eudi-statuslist-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: backup
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-eudi-statuslist-backup
          {{- else }}
          emptyDir: {}
          {{- end }}
