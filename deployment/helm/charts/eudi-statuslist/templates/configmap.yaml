apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-eudi-statuslist-config
  labels:
    app.kubernetes.io/name: eudi-statuslist
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config_service.py: |
    # coding: latin-1
    import logging
    import os
    from logging.handlers import TimedRotatingFileHandler

    class ConfService:

        service_url = {{ .Values.publicURL | quote }}
        token_status_list_size = 10000

        status_list_dir = "/var/opt/status_lists"
        backup_dir = "/var/opt/status_list_backup"

        countries = {
            "FC": {
                "privKey": "/status-list/certs/key.pem",
                "privkey_passwd": None,
                "cert": "/status-list/certs/cert.der",
            }
        }

        # Include both the upstream default PID VCT and the DCS target VCT.
        ALLOWED_DOCTYPES = {
            "urn:eudi:pid:1",
            "eu.europa.ec.eudi.pid.1",
            "org.iso.18013.5.1.mDL",
            "urn:eudi:ehic:1",
            "urn:eu.europa.ec.eudi:learning:credential:1",
            "key-attestation+jwt",
            "oauth-client-attestation+jwt",
        }

        log_dir = "/tmp/status_lists"
        log_file_info = "status_lists.log"
        backup_count = 7

        try:
            os.makedirs(log_dir)
        except FileExistsError:
            pass

        log_handler_info = TimedRotatingFileHandler(
            filename=f"{log_dir}/{log_file_info}",
            when="midnight",
            interval=1,
            backupCount=backup_count,
        )

        console_handler = logging.StreamHandler()
        console_handler.setFormatter(
            logging.Formatter("%(asctime)s %(name)s %(levelname)s %(message)s")
        )
        log_handler_info.setFormatter(
            logging.Formatter("%(asctime)s %(name)s %(levelname)s %(message)s")
        )

        app_logger = logging.getLogger("revocation_app_logger")
        app_logger.addHandler(log_handler_info)
        app_logger.addHandler(console_handler)
        app_logger.setLevel(logging.INFO)
