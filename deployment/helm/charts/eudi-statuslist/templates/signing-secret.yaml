{{- if and (not .Values.signing.existingSecret) (not .Values.signing.generate) }}
{{/*
Stable Status Issuer signing material (files/key.pem + files/cert.der).
Pinned in backend/config/oid4vp/trust.dev.json under the status-list publicURL host.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-eudi-statuslist-signing
  labels:
    app.kubernetes.io/name: eudi-statuslist
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  key.pem: {{ .Files.Get "files/key.pem" | b64enc }}
  cert.der: {{ .Files.Get "files/cert.der" | b64enc }}
  cert.crt: {{ .Files.Get "files/cert.crt" | b64enc }}
{{- end }}
