{{- if and .Values.ingress.enabled .Values.ingress.host .Values.ingress.wellKnownPathRewrite.enabled }}
{{- $suffix := trimAll "/" (.Values.ingress.wellKnownPathRewrite.pathSuffix | default .Values.wellKnownPathRewrite.pathSuffix | default "realms/gaia-x") }}
{{/*
Wallets following RFC8414 insert /.well-known/<name> between host and realm path.
Keycloak serves /realms/.../.well-known/<name>.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-keycloak-well-known-rewrite
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replacePathRegex:
    regex: ^/\.well-known/(oauth-authorization-server|openid-configuration)/{{ $suffix }}/?$
    replacement: /{{ $suffix }}/.well-known/$1
{{- end }}
