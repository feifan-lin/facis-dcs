image:
  repository: quay.io/keycloak/keycloak
  tag: "26.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  nodePort: null
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: ""

# Route path when Keycloak is behind a reverse proxy at a subpath (e.g., "/auth").
# Sets KC_HTTP_RELATIVE_PATH automatically.
route:
  path: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: "/"
  pathType: Prefix
  tls: []
  # Traefik: /.well-known/<meta>/realms/gaia-x -> /realms/gaia-x/.well-known/<meta>
  wellKnownPathRewrite:
    enabled: false
    pathSuffix: "realms/gaia-x"

# NodePort: nginx in front rewrites RFC8414 AS discovery URLs onto Keycloak paths.
wellKnownPathRewrite:
  enabled: false
  pathSuffix: "realms/gaia-x"

cors:
  enabled: false
  allowOrigin: "*"
  allowMethods: "GET, POST, PUT, DELETE, OPTIONS"
  allowHeaders: "*"

edgeProxy:
  image: "nginx:1.27-alpine"
  backendHost: ""

auth:
  adminUser: admin
  adminPassword: admin

extraEnv: []

# Realm import configuration.
# When enabled, imports the gaia-x realm with pre-configured clients (federated-catalogue, dcs-client) and roles on startup.
realm:
  import: false
  dcsClient:
    redirectUris:
      - "*"
    webOrigins:
      - "*"
  # EUDI SD-JWT PID issuance.
  pidIssuer:
    serviceClient:
      secret: ""
    holderClient:
      redirectUris:
        - http://127.0.0.1:8765/callback
      webOrigins:
        - http://127.0.0.1:8765

resources: {}
