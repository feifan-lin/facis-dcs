{{- $edgeProxy := or .Values.trailingSlashRedirect.enabled .Values.cors.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eudi-pid-issuer
  labels:
    app.kubernetes.io/name: eudi-pid-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eudi-pid-issuer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eudi-pid-issuer
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if $edgeProxy }}
      annotations:
        checksum/trailing-slash-proxy: {{ include (print $.Template.BasePath "/trailing-slash-proxy-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.database.migrate }}
      initContainers:
        - name: migrate-schema
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -e
              echo "Waiting for PostgreSQL..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 2; done
              echo "Applying PID Issuer schema (idempotent)..."
              psql -v ON_ERROR_STOP=1 -f /schema/V1.sql
          env:
            - name: PGHOST
              value: {{ regexReplaceAll "^r2dbc:pool:postgresql://([^:/]+).*" .Values.database.url "${1}" | quote }}
            - name: PGPORT
              value: {{ regexReplaceAll "^r2dbc:pool:postgresql://[^:]+:([0-9]+).*" .Values.database.url "${1}" | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ regexReplaceAll "^r2dbc:pool:postgresql://[^/]+/([^?]+).*" .Values.database.url "${1}" | quote }}
            - name: PGUSER
              value: {{ .Values.database.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: database-password
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      {{- end }}
      containers:
        {{- if $edgeProxy }}
        - name: trailing-slash-proxy
          image: {{ .Values.trailingSlashRedirect.image | default "nginx:1.27-alpine" | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: trailing-slash-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
        - name: eudi-pid-issuer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            {{- if $edgeProxy }}
            - name: backend
              containerPort: 8081
              protocol: TCP
            {{- else }}
            - name: http
              containerPort: {{ .Values.service.port | default 8080 }}
              protocol: TCP
            {{- end }}
          env:
            {{- if $edgeProxy }}
            - name: SERVER_PORT
              value: "8081"
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxDirectMemorySize=64M"
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfiles | quote }}
            - name: SPRING_WEBFLUX_BASE_PATH
              value: {{ .Values.basePath | quote }}
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: "FRAMEWORK"
            - name: SPRING_HTTP_CODECS_MAXINMEMORYSIZE
              value: "8MB"

            - name: ISSUER_PUBLICURL
              value: {{ required "eudiPidIssuer.publicURL is required" .Values.publicURL | quote }}
            - name: ISSUER_AUTHORIZATIONSERVER_PUBLICURL
              value: {{ required "eudiPidIssuer.authorizationServer.publicURL is required" .Values.authorizationServer.publicURL | quote }}
            - name: ISSUER_AUTHORIZATIONSERVER_INTROSPECTION
              value: {{ required "eudiPidIssuer.authorizationServer.introspectionURL is required" .Values.authorizationServer.introspectionURL | quote }}
            - name: ISSUER_CREDENTIALOFFER_DEFAULTURI
              value: {{ .Values.credentialOffer.defaultUri | quote }}
            - name: ISSUER_CREDENTIALOFFER_ALLOWEDSCHEMES
              value: {{ .Values.credentialOffer.allowedSchemes | quote }}

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID
              value: {{ .Values.oauth.clientId | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: oauth-client-secret

            - name: ISSUER_KEYCLOAK_SERVER_URL
              value: {{ .Values.keycloak.serverURL | quote }}
            - name: ISSUER_KEYCLOAK_AUTHENTICATION_REALM
              value: {{ .Values.keycloak.authenticationRealm | quote }}
            - name: ISSUER_KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: ISSUER_KEYCLOAK_USERNAME
              value: {{ .Values.keycloak.username | quote }}
            - name: ISSUER_KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: keycloak-password
            - name: ISSUER_KEYCLOAK_USER_REALM
              value: {{ .Values.keycloak.userRealm | quote }}

            - name: ISSUER_DPOP_REALM
              value: {{ .Values.dpopRealm | quote }}

            - name: SPRING_R2DBC_URL
              value: {{ .Values.database.url | quote }}
            - name: SPRING_R2DBC_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: database-password

            - name: ISSUER_STATUSLIST_SERVICE_GENERATE_URI
              value: {{ .Values.statusList.generateURI | quote }}
            - name: ISSUER_STATUSLIST_SERVICE_REVOKE_URI
              value: {{ .Values.statusList.revokeURI | quote }}
            - name: ISSUER_STATUSLIST_SERVICE_APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: statuslist-api-key

            - name: ISSUER_KEYSTORE_FILE
              value: "file:/run/eudi-secrets/keystore"
            - name: ISSUER_KEYSTORE_TYPE
              value: {{ .Values.keystore.type | quote }}
            - name: ISSUER_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: keystore-password

            - name: ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS
              value: {{ .Values.keystore.aliases.sdJwtSigning | quote }}
            - name: ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: sdjwt-signing-password
            - name: ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS
              value: {{ .Values.keystore.aliases.requestEncryption | quote }}
            - name: ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: request-encryption-password
            - name: ISSUER_CREDENTIALREQUESTENCRYPTION_SUPPORTED
              value: {{ .Values.credentialEncryption.requestSupported | default false | quote }}
            - name: ISSUER_CREDENTIALREQUESTENCRYPTION_REQUIRED
              value: {{ .Values.credentialEncryption.requestRequired | default false | quote }}
            - name: ISSUER_CREDENTIALRESPONSEENCRYPTION_SUPPORTED
              value: {{ .Values.credentialEncryption.responseSupported | default false | quote }}
            - name: ISSUER_CREDENTIALRESPONSEENCRYPTION_REQUIRED
              value: {{ .Values.credentialEncryption.responseRequired | default false | quote }}
            - name: ISSUER_NONCE_ENCRYPTIONKEY_ALIAS
              value: {{ .Values.keystore.aliases.nonceEncryption | quote }}
            - name: ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: nonce-encryption-password
            - name: ISSUER_ACCESSCERTIFICATE_ALIAS
              value: {{ .Values.keystore.aliases.accessCertificate | quote }}
            - name: ISSUER_ACCESSCERTIFICATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-eudi-pid-issuer
                  key: access-certificate-password

            - name: ISSUER_PID_SD_JWT_VC_ENABLED
              value: {{ .Values.pid.sdJwtVc.enabled | quote }}
            - name: ISSUER_PID_SD_JWT_VC_DURATION
              value: {{ .Values.pid.sdJwtVc.duration | quote }}
            - name: ISSUER_PID_SD_JWT_VC_KEY_ATTESTATIONS_REQUIRED
              value: {{ .Values.pid.sdJwtVc.keyAttestationsRequired | default false | quote }}
            - name: ISSUER_PID_MSO_MDOC_ENABLED
              value: {{ .Values.pid.msoMdoc.enabled | quote }}
            - name: ISSUER_MDL_ENABLED
              value: {{ .Values.pid.mdl.enabled | quote }}
            - name: ISSUER_LEARNINGCREDENTIAL_ENABLED
              value: {{ .Values.pid.learningCredential.enabled | quote }}
            - name: ISSUER_METADATA_PREFERRED_CLIENT_STATUS_PERIOD
              value: {{ .Values.preferredClientStatusPeriod | quote }}
            - name: ISSUER_SD_JWT_VC_TYPE_METADATA_0_VCT
              value: {{ .Values.pid.sdJwtVc.targetVct | quote }}
            - name: ISSUER_SD_JWT_VC_TYPE_METADATA_0_RESOURCE
              value: "classpath:/vct/pid_v1.4.json"

            {{- if .Values.pid.sdJwtVc.reusePolicy.enabled }}
            - name: ISSUER_PID_SD_JWT_VC_REUSEPOLICY_ENABLED
              value: "true"
            - name: ISSUER_PID_SD_JWT_VC_REUSEPOLICY_TYPE
              value: {{ .Values.pid.sdJwtVc.reusePolicy.type | quote }}
            {{- range $i, $opt := .Values.pid.sdJwtVc.reusePolicy.options }}
            - name: ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_{{ $i }}_DETAILS
              value: {{ $opt.details | quote }}
            {{- if $opt.batchSize }}
            - name: ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_{{ $i }}_BATCHSIZE
              value: {{ $opt.batchSize | quote }}
            {{- end }}
            {{- if $opt.reissueTriggerUnused }}
            - name: ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_{{ $i }}_REISSUETRIGGERUNUSED
              value: {{ $opt.reissueTriggerUnused | quote }}
            {{- end }}
            {{- end }}
            {{- end }}

            - name: ISSUER_METADATA_DISPLAY_0_NAME
              value: "DCS PID Issuer"
            - name: ISSUER_METADATA_DISPLAY_0_LOCALE
              value: "en"
          volumeMounts:
            - name: keystore
              mountPath: /run/eudi-secrets
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: {{ if $edgeProxy }}backend{{ else }}http{{ end }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ if $edgeProxy }}backend{{ else }}http{{ end }}
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.database.migrate }}
        - name: schema
          configMap:
            name: {{ .Release.Name }}-eudi-pid-issuer-schema
        {{- end }}
        {{- if $edgeProxy }}
        - name: trailing-slash-nginx
          configMap:
            name: {{ .Release.Name }}-eudi-pid-issuer-trailing-slash
        {{- end }}
        - name: keystore
          secret:
            secretName: {{ .Values.keystore.existingSecret | default (printf "%s-eudi-pid-issuer" .Release.Name) }}
            items:
              - key: {{ .Values.keystore.secretKey }}
                path: keystore
