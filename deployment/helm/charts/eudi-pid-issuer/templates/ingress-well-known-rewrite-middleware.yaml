{{- if and .Values.ingress.enabled .Values.ingress.wellKnownPathRewrite.enabled }}
{{- $suffix := trimPrefix "/" (.Values.ingress.wellKnownPathRewrite.pathSuffix | default (trimPrefix "/" (.Values.basePath | default "/pid-issuer"))) }}
{{/*
Wallets following RFC8414/RFC9728 insert /.well-known/<name> between host and path.
EUDI pid-issuer (with SPRING_WEBFLUX_BASE_PATH) serves /.well-known under the base path.
Rewrite e.g. /.well-known/openid-credential-issuer/pid-issuer
     -> /pid-issuer/.well-known/openid-credential-issuer
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-eudi-pid-issuer-well-known-rewrite
  labels:
    app.kubernetes.io/name: eudi-pid-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replacePathRegex:
    regex: ^/\.well-known/(openid-credential-issuer|oauth-protected-resource|jwt-vc-issuer)/{{ $suffix }}/?$
    replacement: /{{ $suffix }}/.well-known/$1
{{- end }}
